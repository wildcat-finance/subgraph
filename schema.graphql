  blockNumber: Int!
  blockTimestamp: Int!
  transactionHash: Bytes!
  blockLogIndex: Int!
}

type ControllerAdded @entity(immutable: true) {
  id: ID!
  controllerFactory: ControllerFactory! # address
  controller: Controller! # address
  blockNumber: Int!
  blockTimestamp: Int!
  transactionHash: Bytes!
  blockLogIndex: Int!
}

type ControllerFactoryAdded @entity(immutable: true) {
  id: ID!
  controllerFactory: ControllerFactory! # address
