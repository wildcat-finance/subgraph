type SimpleCollateralFactory @entity {
  id: ID!
  address: Bytes!
  label: String!
  generation: String!
  configuredStartBlock: BigInt!
  indexed: Boolean!
  lifecycle: FactoryLifecycle!
  configured: Boolean!
  collateralContracts: [SimpleCollateralContract!]!
    @derivedFrom(field: "factory")
  approvedLiquidators: [ApprovedLiquidator!]! @derivedFrom(field: "factory")
  liquidatorApprovals: [LiquidatorApproved!]! @derivedFrom(field: "factory")
  liquidatorRemovals: [LiquidatorRemoved!]! @derivedFrom(field: "factory")
  approvedExchanges: [ApprovedCollateralExchange!]!
    @derivedFrom(field: "factory")
}

type ApprovedCollateralExchange @entity {
  id: ID!
  factory: SimpleCollateralFactory!
  isApproved: Boolean!
  exchange: Bytes!
}

type CollateralExchangeApproved @entity(immutable: true) {
  id: ID!
  factory: SimpleCollateralFactory!
  exchange: Bytes!

  blockNumber: Int!
  blockTimestamp: Int!
  transactionHash: Bytes!
  blockLogIndex: Int!
}

type CollateralExchangeRemoved @entity(immutable: true) {
  id: ID!
  factory: SimpleCollateralFactory!
  exchange: Bytes!

  blockNumber: Int!
  blockTimestamp: Int!
  transactionHash: Bytes!
  blockLogIndex: Int!
}

type ApprovedLiquidator @entity {
  id: ID!
  factory: SimpleCollateralFactory!
  isApproved: Boolean!
  liquidator: Bytes!
}

type LiquidatorApproved @entity(immutable: true) {
  id: ID!
  factory: SimpleCollateralFactory!
  liquidator: Bytes!

  blockNumber: Int!
  blockTimestamp: Int!
  transactionHash: Bytes!
  blockLogIndex: Int!
}

type LiquidatorRemoved @entity(immutable: true) {
  id: ID!
  factory: SimpleCollateralFactory!
  liquidator: Bytes!

  blockNumber: Int!
  blockTimestamp: Int!
  transactionHash: Bytes!
  blockLogIndex: Int!
}

type SimpleCollateralContract @entity {
  id: ID!
  address: Bytes!
  factory: SimpleCollateralFactory!
  market: Market
  marketAddress: Bytes!
  collateralAsset: Token!

  totalDeposited: BigInt!
  totalReclaimed: BigInt!
  totalLiquidated: BigInt!
  totalShares: BigInt!
  availableCollateral: BigInt!

  lastFullLiquidationIndex: Int!
  depositIndex: Int!
  liquidationCooldown: Int
  nextLiquidationTrigger: Int!
  eventIndex: Int!

  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  createdAtTransaction: Bytes!
  createdAtLogIndex: BigInt!
  creation: SimpleCollateralContractCreated
    @derivedFrom(field: "collateralContract")
  snapshot: SimpleCollateralContractSnapshot
    @derivedFrom(field: "collateralContract")

  depositors: [SimpleCollateralContractDepositor!]!
    @derivedFrom(field: "collateralContract")
  liquidations: [SimpleCollateralContractLiquidation!]!
    @derivedFrom(field: "collateralContract")
  deposits: [SimpleCollateralContractDeposit!]!
    @derivedFrom(field: "collateralContract")
  reclaims: [SimpleCollateralContractReclaim!]!
    @derivedFrom(field: "collateralContract")
  fullResets: [SimpleCollateralContractFullReset!]!
    @derivedFrom(field: "collateralContract")
  liquidatedSharesResets: [SimpleCollateralContractLiquidatedSharesReset!]!
    @derivedFrom(field: "collateralContract")
}

type SimpleCollateralContractDepositor @entity {
  id: ID!
  collateralContract: SimpleCollateralContract!
  address: Bytes!

  shares: BigInt!
  totalDeposited: BigInt!
  totalReclaimed: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
  updatedAtTransaction: Bytes!
  updatedAtLogIndex: BigInt!

  deposits: [SimpleCollateralContractDeposit!]! @derivedFrom(field: "account")
  reclaims: [SimpleCollateralContractReclaim!]! @derivedFrom(field: "account")
  liquidatedSharesResets: [SimpleCollateralContractLiquidatedSharesReset!]!
    @derivedFrom(field: "account")
}

type SimpleCollateralContractCreated @entity(immutable: true) {
  id: ID!
  factory: SimpleCollateralFactory!
  collateralContract: SimpleCollateralContract!
  collateralContractAddress: Bytes!
  collateralAsset: Token!
  market: Market
  marketAddress: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  blockLogIndex: BigInt!
}

"Explicitly staleable event-derived collateral contract state."
type SimpleCollateralContractSnapshot @entity {
  id: ID! # collateral contract address
  collateralContract: SimpleCollateralContract!
  source: SnapshotSource!
  totalDeposited: BigInt!
  totalReclaimed: BigInt!
  totalLiquidated: BigInt!
  totalShares: BigInt!
  availableCollateral: BigInt!
  lastFullLiquidationIndex: Int!
  depositIndex: Int!
  liquidationCooldown: Int
  nextLiquidationTrigger: Int!
  eventIndex: Int!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
  updatedAtTransaction: Bytes!
  updatedAtLogIndex: BigInt!
}

"Internal lookup used to reconcile collateral events seen before their market."
type SimpleCollateralMarketIndex @entity {
  id: ID! # market address
  marketAddress: Bytes!
  collateralContractIds: [String!]!
}

type SimpleCollateralContractLiquidation @entity(immutable: true) {
  id: ID!
  collateralContract: SimpleCollateralContract!

  collateralLiquidated: BigInt!
  underlyingReceived: BigInt!
  liquidator: Bytes!
  eventIndex: Int!

  blockNumber: Int!
  blockTimestamp: Int!
  transactionHash: Bytes!
  blockLogIndex: Int!
}

type SimpleCollateralContractFullReset @entity(immutable: true) {
  id: ID!
  collateralContract: SimpleCollateralContract!

  lastFullLiquidationIndex: Int!
  eventIndex: Int!
  blockNumber: Int!
  blockTimestamp: Int!
  transactionHash: Bytes!
  blockLogIndex: Int!
}

type SimpleCollateralContractLiquidatedSharesReset @entity(immutable: true) {
  id: ID!
  collateralContract: SimpleCollateralContract!
  account: SimpleCollateralContractDepositor!
  sharesReset: BigInt!

  eventIndex: Int!
  blockNumber: Int!
  blockTimestamp: Int!
  transactionHash: Bytes!
  blockLogIndex: Int!
}

type SimpleCollateralContractDeposit @entity(immutable: true) {
  id: ID!
  collateralContract: SimpleCollateralContract!
  account: SimpleCollateralContractDepositor!

  amountDeposited: BigInt!
  sharesMinted: BigInt!
  lastFullLiquidationIndex: Int!
  depositIndex: Int!

  eventIndex: Int!
  blockNumber: Int!
  blockTimestamp: Int!
  transactionHash: Bytes!
  blockLogIndex: Int!
}

type SimpleCollateralContractReclaim @entity(immutable: true) {
  id: ID!
  collateralContract: SimpleCollateralContract!

  account: SimpleCollateralContractDepositor!
  amountReclaimed: BigInt!
  sharesBurned: BigInt!

  eventIndex: Int!
  blockNumber: Int!
  blockTimestamp: Int!
  transactionHash: Bytes!
  blockLogIndex: Int!
}

