type RoleProviderRootChange @entity(immutable: true) {
  id: ID! # transaction hash and log index
  provider: RoleProviderInstance!
  administrator: Bytes!
  previousRoot: Bytes!
  newRoot: Bytes!
  blockNumber: BigInt!
