"Build-time deployment facts shared by every endpoint using this schema."
type IndexerDeployment @entity {
  id: ID! # "deployment"
  chainId: BigInt!
  network: String!
  graphNetwork: String!
  schemaRelease: String!
  configDigest: String!
  archController: Bytes!
  sanctionsSentinel: Bytes!
  analyticsEnabled: Boolean!
  collateralEnabled: Boolean!
  wrappersEnabled: Boolean!
  pricingMode: PricingMode!
  firstObservedBlock: BigInt!
  firstObservedTimestamp: BigInt!
  firstObservedTransaction: Bytes!
  firstObservedLogIndex: BigInt!
}

"v2.0.1"
type SubgraphVersion @entity {
  id: ID!
}

# -------------------------------------------------------------------------- #
#                            WildcatArchController                           #
# -------------------------------------------------------------------------- #

type ArchController @entity {
  id: ID!
  controllerFactories: [ControllerFactory!]!
    @derivedFrom(field: "archController")
  controllers: [Controller!]! @derivedFrom(field: "archController")
  markets: [Market!]! @derivedFrom(field: "archController")
  borrowers: [RegisteredBorrower!]! @derivedFrom(field: "archController")
  hooksFactories: [HooksFactory!]! @derivedFrom(field: "archController")
  borrowerIdentityRegistries: [BorrowerIdentityRegistry!]!
    @derivedFrom(field: "archController")
  factoryRegistrations: [FactoryRegistration!]!
    @derivedFrom(field: "archController")
}

"Current observed ArchController state for any registered factory address."
type FactoryRegistration @entity {
  id: ID! # arch-controller-factory
  archController: ArchController!
  factoryAddress: Bytes!
  kind: FactoryKind!
  isRegistered: Boolean!
  controllerFactory: ControllerFactory
  hooksFactory: HooksFactory
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
  updatedAtTransaction: Bytes!
  updatedAtLogIndex: BigInt!
  changes: [FactoryRegistrationEvent!]! @derivedFrom(field: "registration")
}

"Immutable ArchController add/remove history, including unclassified factories."
type FactoryRegistrationEvent @entity(immutable: true) {
  id: ID! # transaction-hash-log-index
  registration: FactoryRegistration!
  factoryAddress: Bytes!
  kind: FactoryKind!
  change: FactoryRegistrationChangeKind!
  isRegistered: Boolean!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  blockLogIndex: BigInt!
}

"Explicit indexing anomaly; unexpected observations must not disappear silently."
type IndexerDiagnostic @entity(immutable: true) {
  id: ID!
  kind: IndexerDiagnosticKind!
  message: String!
  contractAddress: Bytes
  relatedAddress: Bytes
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  blockLogIndex: BigInt!
}

type RegisteredBorrower @entity {
  id: ID!
  archController: ArchController!
  profile: Borrower!
  borrower: Bytes!
  isRegistered: Boolean!
  changes: [BorrowerRegistrationChange!]! @derivedFrom(field: "registration")
}

"Canonical on-chain borrower identity joining registration, markets, and analytics."
type Borrower @entity {
  id: ID! # borrower address
  address: Bytes!
  firstSeenBlock: BigInt!
  firstSeenTimestamp: BigInt!
  firstSeenTransaction: Bytes!
  firstSeenLogIndex: BigInt!
  lastSeenBlock: BigInt!
  lastSeenTimestamp: BigInt!
  lastSeenTransaction: Bytes!
  lastSeenLogIndex: BigInt!
  registrations: [RegisteredBorrower!]! @derivedFrom(field: "profile")
  markets: [Market!]! @derivedFrom(field: "borrowerProfile")
  stats: BorrowerStats @derivedFrom(field: "profile")
  dailyStats: [BorrowerDailyStats!]! @derivedFrom(field: "profile")
  sanctionsEscrows: [SanctionsEscrow!]! @derivedFrom(field: "borrower")
  sanctionOverrideStatuses: [SanctionOverrideStatus!]!
    @derivedFrom(field: "borrower")
  accounts: [BorrowerAccount!]! @derivedFrom(field: "principal")
  pendingAccounts: [BorrowerAccount!]! @derivedFrom(field: "pendingPrincipal")
}

"Registry that resolves operational borrower accounts to legal principals."
type BorrowerIdentityRegistry @entity {
  id: ID! # registry address
  address: Bytes!
  archController: ArchController!
  accountFactories: [BorrowerAccountFactory!]! @derivedFrom(field: "registry")
  accounts: [BorrowerAccount!]! @derivedFrom(field: "registry")
  markets: [Market!]! @derivedFrom(field: "borrowerIdentityRegistry")
  eventIndex: Int!
}

"Current approval state for one account factory in one identity registry."
type BorrowerAccountFactory @entity {
  id: ID! # registry address and account-factory address
  registry: BorrowerIdentityRegistry!
  address: Bytes!
  isApproved: Boolean!
  accounts: [BorrowerAccount!]! @derivedFrom(field: "accountFactory")
  changes: [BorrowerAccountFactoryChange!]!
    @derivedFrom(field: "accountFactory")
}

type BorrowerAccountFactoryChange @entity(immutable: true) {
  id: ID! # transaction hash and log index
  registry: BorrowerIdentityRegistry!
  accountFactory: BorrowerAccountFactory!
  administrator: Bytes!
  isApproved: Boolean!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  blockLogIndex: BigInt!
}

"A contract account registered to one current legal principal."
type BorrowerAccount @entity {
  id: ID! # registry address and account address
  address: Bytes!
  registry: BorrowerIdentityRegistry!
  accountFactory: BorrowerAccountFactory!
  principal: Borrower!
  principalAddress: Bytes!
  pendingPrincipal: Borrower
  pendingPrincipalAddress: Bytes
  registeredAtBlock: BigInt!
  registeredAtTimestamp: BigInt!
  registeredAtTransaction: Bytes!
  registeredAtLogIndex: BigInt!
  markets: [Market!]! @derivedFrom(field: "borrowerAccount")
  changes: [BorrowerAccountPrincipalChange!]! @derivedFrom(field: "account")
}

type BorrowerAccountPrincipalChange @entity(immutable: true) {
  id: ID! # transaction hash and log index
  account: BorrowerAccount!
  kind: BorrowerAccountPrincipalChangeKind!
  currentPrincipal: Borrower
  currentPrincipalAddress: Bytes
  previousPrincipal: Borrower
  previousPrincipalAddress: Bytes
  newPrincipal: Borrower
  newPrincipalAddress: Bytes
  previousPendingPrincipal: Borrower
  previousPendingPrincipalAddress: Bytes
  pendingPrincipal: Borrower
  pendingPrincipalAddress: Bytes
  cancelledPendingPrincipal: Borrower
  cancelledPendingPrincipalAddress: Bytes
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  blockLogIndex: BigInt!
}

type BorrowerRegistrationChange @entity(immutable: true) {
  id: ID!
  registration: RegisteredBorrower!
  isRegistered: Boolean!
  blockNumber: Int!
  blockTimestamp: Int!
  transactionHash: Bytes!
  blockLogIndex: Int!
}

type ControllerFactoryRemoved @entity(immutable: true) {
