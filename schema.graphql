"Deterministic sanctions escrow identity discovered from its creation event."
type SanctionsEscrow @entity {
  id: ID! # escrow address
  address: Bytes!
  sentinel: Bytes!
  borrower: Borrower!
  borrowerAddress: Bytes!
  account: Bytes!
  asset: Bytes!
  deployedAtBlock: BigInt!
  deployedAtTimestamp: BigInt!
  deployedAtTransaction: Bytes!
  deployedAtLogIndex: BigInt!
  creation: NewSanctionsEscrow @derivedFrom(field: "escrow")
}

"Latest event-derived override state for one borrower/account pair."
type SanctionOverrideStatus @entity {
  id: ID! # borrower-account
  borrower: Borrower!
  borrowerAddress: Bytes!
  account: Bytes!
  isOverridden: Boolean!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
  updatedAtTransaction: Bytes!
  updatedAtLogIndex: BigInt!
  overrides: [SanctionOverride!]! @derivedFrom(field: "status")
  removals: [SanctionOverrideRemoved!]! @derivedFrom(field: "status")
}

# -------------------------------------------------------------------------- #
#                              HooksInstance                            #
# -------------------------------------------------------------------------- #

type LenderHooksAccess @entity {
  id: ID! # LenderHooksAccess-hooksAddress-lenderAddress
  addedTimestamp: Int!
  lender: Bytes! # address
  isBlockedFromDeposits: Boolean!
  lastProvider: RoleProvider # address
  canRefresh: Boolean!
  lastApprovalTimestamp: Int!
  hooks: HooksInstance! # address
  knownLenderStatuses: [KnownLenderStatus!]! @derivedFrom(field: "hooksAccess")
  marketAccounts: [LenderAccount!]! @derivedFrom(field: "hooksAccess")
  accountAccessGrantedRecords: [AccountAccessGranted!]!
    @derivedFrom(field: "account")
  accountAccessRevokedRecords: [AccountAccessRevoked!]!
    @derivedFrom(field: "account")
  accountBlockedFromDepositsRecords: [AccountBlockedFromDeposits!]!
    @derivedFrom(field: "account")
  accountUnblockedFromDepositsRecords: [AccountUnblockedFromDeposits!]!
    @derivedFrom(field: "account")
}

type HooksInstance @entity {
  id: ID! # address
  address: Bytes!
  name: String!
  kind: HooksKind!
  marketKind: MarketKind!
  generation: String!
  abiFamily: String!
  eventGeneration: EventGeneration!
  borrower: Bytes! # administrator, retained for compatibility
  administrator: Bytes!
  pendingAdministrator: Bytes
  deployer: Bytes!
  version: String!
  providerMetadataState: ProviderMetadataState!
  hooksTemplate: HooksTemplate! # address
  templateRegistration: HooksTemplateRegistration!
  markets: [Market!]! @derivedFrom(field: "hooks")
  providers: [RoleProvider!]! @derivedFrom(field: "hooks")
  hooksFactory: HooksFactory!
  eventIndex: Int!
  numMarkets: Int!
  deployedAtBlock: BigInt!
  deployedAtTimestamp: BigInt!
  deployedAtTransaction: Bytes!
  deployedAtLogIndex: BigInt!
  deployment: HooksInstanceDeployed @derivedFrom(field: "hooks")
  roleProviderSnapshots: [HooksInstanceRoleProviderSnapshot!]!
    @derivedFrom(field: "hooks")
  lenders: [LenderHooksAccess!]! @derivedFrom(field: "hooks")

  nameUpdatedRecords: [HooksNameUpdated!]! @derivedFrom(field: "hooks")
  roleProviderAddedRecords: [RoleProviderAdded!]! @derivedFrom(field: "hooks")
  roleProviderUpdatedRecords: [RoleProviderUpdated!]!
    @derivedFrom(field: "hooks")
  roleProviderRemovedRecords: [RoleProviderRemoved!]!
    @derivedFrom(field: "hooks")
  accountUnblockFromDepositsRecords: [AccountUnblockedFromDeposits!]!
    @derivedFrom(field: "hooks")
  accountAccessGrantedRecords: [AccountAccessGranted!]!
    @derivedFrom(field: "hooks")
  accountAccessRevokedRecords: [AccountAccessRevoked!]!
    @derivedFrom(field: "hooks")
  administratorChanges: [HookAdministratorChange!]! @derivedFrom(field: "hooks")
}

type HookAdministratorChange @entity(immutable: true) {
  id: ID! # transaction hash and log index
  hooks: HooksInstance!
  kind: AdministratorChangeKind!
  administrator: Bytes
  previousAdministrator: Bytes
  newAdministrator: Bytes
  previousPendingAdministrator: Bytes
  pendingAdministrator: Bytes
  cancelledPendingAdministrator: Bytes
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  blockLogIndex: BigInt!
}

type KnownLenderStatus @entity {
  id: ID! #KNOWNLENDER-marketAddress-lenderAddress
  hooksAccess: LenderHooksAccess! # address
  market: Market! # address
  lenderAccount: LenderAccount # address
}

type RoleProvider @entity {
  id: ID! # PROVIDER-hooksAddress-providerAddress
  providerAddress: Bytes! # address
  providerInstance: RoleProviderInstance!
  hooks: HooksInstance! # address
  # version: String!
  timeToLive: BigInt!
  isPullProvider: Boolean!
  pullProviderIndex: Int!
  isPushProvider: Boolean!
  pushProviderIndex: Int!
  isApproved: Boolean!
  # Most recently observed lifecycle events. The plural derived fields retain
  # the complete indexed remove/re-add history without making singular
  # relations ambiguous.
  addedEvent: RoleProviderAdded
  removedEvent: RoleProviderRemoved
  addedEvents: [RoleProviderAdded!]! @derivedFrom(field: "provider")
  removedEvents: [RoleProviderRemoved!]! @derivedFrom(field: "provider")
  updatedEvents: [RoleProviderUpdated!]! @derivedFrom(field: "provider")
}

"Reusable credential provider identity. Hook-specific TTL and indexes live on RoleProvider attachments."
type RoleProviderInstance @entity {
  id: ID! # provider address
  address: Bytes!
  kind: RoleProviderKind!
  administrator: Bytes
  pendingAdministrator: Bytes
  deployer: Bytes
  deploymentFactory: RoleProviderFactory
  salt: Bytes
  root: Bytes
  token: Bytes
  vault: Bytes
  minBalance: BigInt
  minAssets: BigInt
  tokenId: BigInt
  skipInterfaceCheck: Boolean
  deployedAtBlock: BigInt
  deployedAtTimestamp: BigInt
  deployedAtTransaction: Bytes
  deployedAtLogIndex: BigInt
  attachments: [RoleProvider!]! @derivedFrom(field: "providerInstance")
  members: [RoleProviderMember!]! @derivedFrom(field: "provider")
  administratorChanges: [RoleProviderAdministratorChange!]!
    @derivedFrom(field: "provider")
  membershipChanges: [RoleProviderMembershipChange!]!
    @derivedFrom(field: "provider")
  rootChanges: [RoleProviderRootChange!]! @derivedFrom(field: "provider")
}

type RoleProviderFactory @entity {
  id: ID! # factory address
  address: Bytes!
  kind: RoleProviderKind!
  label: String!
  generation: String!
  configuredStartBlock: BigInt!
  indexed: Boolean!
  lifecycle: FactoryLifecycle!
  configured: Boolean!
  eventIndex: Int!
  providers: [RoleProviderInstance!]! @derivedFrom(field: "deploymentFactory")
}

type RoleProviderMember @entity {
  id: ID! # provider address and member address
  provider: RoleProviderInstance!
  account: Bytes!
  isMember: Boolean!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
  updatedAtTransaction: Bytes!
  updatedAtLogIndex: BigInt!
  changes: [RoleProviderMembershipChange!]! @derivedFrom(field: "member")
}

type RoleProviderMembershipChange @entity(immutable: true) {
