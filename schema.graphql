  wrapper: Wildcat4626Wrapper!
  transactionHash: Bytes!
  inboundMarketTransfer: Transfer
  inboundScaledAmount: BigInt!
  inboundPrincipalBasis: BigInt!
  outboundMarketTransfer: Transfer
  outboundScaledAmount: BigInt!
  outboundPrincipalBasis: BigInt!
  pendingBurnAccount: Wildcat4626WrapperAccount
  pendingBurnShares: BigInt!
  pendingBurnPrincipalBasis: BigInt!
}

type Wildcat4626WrapperDeployed @entity(immutable: true) {
  id: ID!
  factory: Wildcat4626WrapperFactory!
  market: Market
  marketAddress: Bytes!
  wrapper: Wildcat4626Wrapper!
  wrapperAddress: Bytes!
  blockNumber: Int!
  blockTimestamp: Int!
  transactionHash: Bytes!
  blockLogIndex: Int!
}

"Internal deterministic lookup used to reconcile wrapper events seen before markets."
type WrapperMarketIndex @entity {
  id: ID! # market address
  marketAddress: Bytes!
  wrapper: Wildcat4626Wrapper!
}

type Market @entity {
  id: ID!
  address: Bytes!
  archController: ArchController!
  isRegistered: Boolean!
  version: MarketVersion!
  marketKind: MarketKind!
  originKind: MarketOriginKind!
  generation: String!
  abiFamily: String!
  eventGeneration: EventGeneration!
  # ---------------------------------- Config -------------------------------- #
  controller: Controller
  hooksFactory: HooksFactory
  hooksConfig: HooksConfig @derivedFrom(field: "market")
  hooks: HooksInstance # address
  borrower: Bytes!
  borrowerAccount: BorrowerAccount
  borrowerPrincipal: Bytes!
  borrowerProfile: Borrower # legal principal
  initialBorrower: Bytes!
  initialBorrowerPrincipal: Bytes!
  pendingBorrower: Bytes
  pendingBorrowerPrincipal: Bytes
  borrowerIdentityRegistry: BorrowerIdentityRegistry
  borrowerIdentityRegistryAddress: Bytes
  sentinel: Bytes!
  feeRecipient: Bytes!
  originationFeeAsset: Token
  originationFeeAmount: BigInt!
  requestedHooks: BigInt
  finalHooks: BigInt
  hooksData: Bytes

  name: String!
  symbol: String!
  decimals: Int!
  protocolFeeBips: Int!
  delinquencyGracePeriod: Int!
  delinquencyFeeBips: Int!
  asset: Token!
  withdrawalBatchDuration: Int!

  # ---------------------------------- State --------------------------------- #
  isClosed: Boolean!
  # Balance of the underlying asset held by the market at the indexed block.
  # Direct ERC-20 transfers are reflected on the next StateUpdated event.
  totalAssets: BigInt!
  maxTotalSupply: BigInt!
  pendingProtocolFees: BigInt!
  # Underlying assets reserved for withdrawals which have been paid
  # by the borrower but not yet executed.
  normalizedUnclaimedWithdrawals: BigInt!
  # Scaled token supply (divided by scaleFactor)
  scaledTotalSupply: BigInt!
  #  Scaled amount in withdrawal batches that have not been paid by borrower
  scaledPendingWithdrawals: BigInt!
  pendingWithdrawalExpiry: BigInt!
  # Whether market is currently delinquent (liquidity under requirement)
  isDelinquent: Boolean!
  # Whether market is currently incurring delinquency penalties (timeDelinquent > delinquencyGracePeriod)
  isIncurringPenalties: Boolean!
  # Seconds borrower has been delinquent
  timeDelinquent: Int!
  # Annual interest rate accrued to lenders, in basis points
  annualInterestBips: Int!
  # Revolving-only annual commitment fee rate, in basis points
  commitmentFeeBips: BigInt
  # Percentage of outstanding balance that must be held in liquid reserves
  reserveRatioBips: Int!
  # Revolving-only drawn principal amount
  drawnAmount: BigInt
  # Ratio between internal balances and underlying token amounts
  scaleFactor: BigInt!
  lastInterestAccruedTimestamp: Int!
  lastInterestAccruedBlockNumber: Int!

  originalAnnualInterestBips: Int!
  originalReserveRatioBips: Int!
  temporaryReserveRatioExpiry: Int!
  temporaryReserveRatioActive: Boolean!

  # -------------------------------- Metadata -------------------------------- #
  # all time borrows
  totalBorrowed: BigInt!
  # all time DebtRepaid amounts
  totalRepaid: BigInt!
  # all time earnings from base APR
  totalBaseInterestAccrued: BigInt!
  # all time earnings from delinquency fees
  totalDelinquencyFeesAccrued: BigInt!
  # all time protocol fees
  totalProtocolFeesAccrued: BigInt!
  # all time deposits
  totalDeposited: BigInt!
  # all time withdrawals requested
  totalWithdrawalsRequested: BigInt!
  # all time withdrawals executed
  totalWithdrawalsExecuted: BigInt!

  # ----------------------------- Cumulative USD ------------------------------ #
  # all time borrows in USD
  totalBorrowedUSD: BigDecimal!
  # all time DebtRepaid amounts in USD
  totalRepaidUSD: BigDecimal!
  # all time earnings from base APR in USD
  totalBaseInterestAccruedUSD: BigDecimal!
  # all time earnings from delinquency fees in USD
  totalDelinquencyFeesAccruedUSD: BigDecimal!
  # all time protocol fees in USD
  totalProtocolFeesAccruedUSD: BigDecimal!
  # all time deposits in USD
  totalDepositedUSD: BigDecimal!
  # all time withdrawals requested in USD
  totalWithdrawalsRequestedUSD: BigDecimal!
  # all time withdrawals executed in USD
  totalWithdrawalsExecutedUSD: BigDecimal!

  # False once a nonzero cumulative mutation could not be priced. This flag is
  # monotonic for the lifetime of the indexed market.
  usdTotalsComplete: Boolean!

  # Current total debt in USD. Zero means the debt is actually zero; null means
  # nonzero debt could not be priced.
  totalDebtUSD: BigDecimal

  eventIndex: Int!
  delinquencyStatusChangedIndex: Int!
  borrowIndex: Int!
  depositIndex: Int!
  feesCollectedIndex: Int!
  debtRepaidIndex: Int!
  maxTotalSupplyUpdatedIndex: Int!
  annualInterestBipsUpdatedIndex: Int!
  withdrawalRequestsIndex: Int!
  protocolFeeBipsUpdatedIndex: Int!
  forceBuyBackIndex: Int!
  fixedTermUpdatedIndex: Int!
  minimumDepositUpdatedIndex: Int!

  # ------------------------------- Dependents ------------------------------- #
  withdrawalBatches: [WithdrawalBatch!]! @derivedFrom(field: "market")
  lenders: [LenderAccount!]! @derivedFrom(field: "market")
  collateralContracts: [SimpleCollateralContract!]!
    @derivedFrom(field: "market")
  tokenWrapper: Wildcat4626Wrapper
  numCollateralContracts: Int!

  "Legacy creation timestamp retained for sorting and analytics compatibility."
  createdAt: Int!
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  createdAtTransaction: Bytes!
  createdAtLogIndex: BigInt!
  snapshot: MarketSnapshot @derivedFrom(field: "market")
  events: [MarketEvent!]! @derivedFrom(field: "market")

  # --------------------------------- Events --------------------------------- #
  deployedEvent: MarketDeployed!
  deploymentConfig: MarketDeploymentConfig @derivedFrom(field: "market")
  deploymentHooksData: MarketHooksData @derivedFrom(field: "market")
  revolvingDeployment: RevolvingMarketDeployment @derivedFrom(field: "market")
  forceBuyBackDisabledRecord: DisabledForceBuyBacks
    @derivedFrom(field: "market")
  marketClosedEvent: MarketClosed @derivedFrom(field: "market")
  removal: MarketRemoved @derivedFrom(field: "market")
  interestAccrualRecords: [MarketInterestAccrued!]!
    @derivedFrom(field: "market")
  delinquencyRecords: [DelinquencyStatusChanged!]! @derivedFrom(field: "market")
  borrowRecords: [Borrow!]! @derivedFrom(field: "market")
  depositRecords: [Deposit!]! @derivedFrom(field: "market")
  feeCollectionRecords: [FeesCollected!]! @derivedFrom(field: "market")
  repaymentRecords: [DebtRepaid!]! @derivedFrom(field: "market")
  reserveRatioBipsUpdatedRecords: [ReserveRatioBipsUpdated!]!
    @derivedFrom(field: "market")
  annualInterestBipsUpdatedRecords: [AnnualInterestBipsUpdated!]!
    @derivedFrom(field: "market")
  maxTotalSupplyUpdatedRecords: [MaxTotalSupplyUpdated!]!
    @derivedFrom(field: "market")
  withdrawalRequestRecords: [WithdrawalRequest!]! @derivedFrom(field: "market")
  protocolFeeBipsUpdatedRecords: [ProtocolFeeBipsUpdated!]!
    @derivedFrom(field: "market")
  forceBuyBackRecords: [ForceBuyBack!]! @derivedFrom(field: "market")
  borrowerChanges: [MarketBorrowerChange!]! @derivedFrom(field: "market")
  drawnAmountUpdates: [DrawnAmountUpdate!]! @derivedFrom(field: "market")
  wrapperRegistrations: [MarketWrapperRegistration!]!
    @derivedFrom(field: "market")

  fixedTermUpdatedRecords: [FixedTermUpdated!]! @derivedFrom(field: "market")
  periodicTermUpdatedRecords: [PeriodicTermUpdated!]!
    @derivedFrom(field: "market")
  periodicTermClosedRecord: PeriodicTermClosed @derivedFrom(field: "market")
  annualInterestBipsReductionProposalRecords: [AnnualInterestBipsReductionProposed!]!
    @derivedFrom(field: "market")
  annualInterestBipsReductionProposalCancelledRecords: [AnnualInterestBipsReductionProposalCancelled!]!
    @derivedFrom(field: "market")
  annualInterestBipsReductionExecutionRecords: [AnnualInterestBipsReductionExecuted!]!
    @derivedFrom(field: "market")
  minimumDepositUpdateRecords: [MinimumDepositUpdated!]!
    @derivedFrom(field: "market")
  accountMadeFirstDepositRecords: [AccountMadeFirstDeposit!]!
    @derivedFrom(field: "market")

  dailyStats: [MarketDailyStats!]! @derivedFrom(field: "market")
  tokenDailyPrice: TokenDailyPrice
}

"One normalized, monotonically ordered entry for every indexed market lifecycle event."
type MarketEvent @entity(immutable: true) {
  id: ID! # transaction hash and log index
  market: Market!
  sequence: Int!
  kind: MarketEventKind!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

"Internal per-market cursor used to assign MarketEvent.sequence."
type MarketEventCursor @entity {
  id: ID! # market address
  market: Market!
  nextSequence: Int!
}

"Explicitly staleable mutable market state. Live action inputs still come from lens/RPC."
type MarketSnapshot @entity {
  id: ID! # market address
  market: Market!
  source: SnapshotSource!
  isClosed: Boolean!
  totalAssets: BigInt!
  maxTotalSupply: BigInt!
  protocolFeeBips: Int!
  pendingProtocolFees: BigInt!
  normalizedUnclaimedWithdrawals: BigInt!
  scaledTotalSupply: BigInt!
  scaledPendingWithdrawals: BigInt!
  pendingWithdrawalExpiry: BigInt!
  isDelinquent: Boolean!
  isIncurringPenalties: Boolean!
  timeDelinquent: Int!
  annualInterestBips: Int!
  commitmentFeeBips: BigInt
  reserveRatioBips: Int!
  drawnAmount: BigInt
  scaleFactor: BigInt!
  lastInterestAccruedTimestamp: Int!
  lastInterestAccruedBlockNumber: Int!
  originalAnnualInterestBips: Int!
  originalReserveRatioBips: Int!
  temporaryReserveRatioExpiry: Int!
  temporaryReserveRatioActive: Boolean!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
  updatedAtTransaction: Bytes!
  updatedAtLogIndex: BigInt!
}

