        - event: AnnualInterestBipsReductionProposalCancelled(indexed address)
          handler: handleAnnualInterestBipsReductionProposalCancelled
        - event: AnnualInterestBipsReductionExecuted(indexed address,uint16)
          handler: handleAnnualInterestBipsReductionExecuted
